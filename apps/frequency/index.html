<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frequency Recognition Trainer</title>
  <style>
    :root {
      --panel-bg: rgba(14, 17, 22, 0.82);
      --panel-border: rgba(255, 255, 255, 0.18);
      --text: #f5f7fb;
      --muted: #b7c0cd;
      --accent: #8ee3cf;
      --button-bg: #e7f4ef;
      --button-text: #10151a;
      --button-muted: rgba(255, 255, 255, 0.12);
      --controls-height: 134px;
      --history-width: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background: #222831;
    }

    body {
      transition: none;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .start-panel {
      width: min(420px, calc(100vw - 32px));
      padding: 22px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel-bg);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
      pointer-events: auto;
    }

    .start-panel h1 {
      margin: 0 0 10px;
      font-size: 1.25rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .start-panel p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 5;
      display: grid;
      gap: 12px;
      width: min(720px, calc(100vw - 28px));
      padding: 14px;
      transform: translateX(-50%);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel-bg);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(14px);
    }

    .controls-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .limit,
    .value {
      color: var(--muted);
      font-size: 0.86rem;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .value {
      color: var(--text);
      text-align: center;
      font-weight: 650;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    button {
      min-height: 38px;
      padding: 0 15px;
      border: 0;
      border-radius: 6px;
      background: var(--button-bg);
      color: var(--button-text);
      font: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: var(--button-muted);
      color: var(--text);
    }

    button:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .result {
      min-height: 1.35rem;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .history {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 4;
      display: flex;
      align-items: flex-end;
      gap: 5px;
      justify-content: flex-end;
      width: var(--history-width);
      height: var(--controls-height);
      pointer-events: none;
    }

    .history-item {
      position: relative;
      flex: 0 0 16px;
      width: 16px;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .history-label {
      position: absolute;
      bottom: var(--label-bottom);
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 0.66rem;
      font-weight: 700;
      line-height: 1;
      text-shadow:
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000,
        1px 1px 0 #000;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .history-bar {
      width: 100%;
      height: max(3px, var(--bar-height));
      border: 2px solid #000;
      border-radius: 4px 4px 0 0;
      background: var(--bar-color);
      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.18) inset;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 560px) {
      .controls {
        gap: 10px;
        padding: 12px;
      }

      .controls-row {
        grid-template-columns: 1fr auto 1fr;
      }

      .controls-row input[type="range"] {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .limit:last-child {
        text-align: right;
      }

      .value {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-live="off">
    <section class="start-panel" id="startPanel">
      <h1>Frequency Recognition Trainer</h1>
      <p>Estimate the flashing frequency from 5 to 40 Hz, then submit your guess.</p>
      <p>WARNING: DO NOT continue further if you have photosensitive epilepsy or are otherwise sensitive to flashing lights.</p>
      <button id="startButton" type="button">Start</button>
    </section>
  </main>

  <section class="controls hidden" id="controls" aria-label="Frequency guess controls">
    <div class="controls-row">
      <span class="limit">5 Hz</span>
      <input id="guessSlider" type="range" min="5" max="40" step="0.1" value="22.5" aria-label="Frequency guess">
      <span class="limit">40 Hz</span>
    </div>
    <div class="value" id="guessValue">22.5 Hz</div>
    <div class="actions">
      <button id="submitButton" type="button">Submit Guess</button>
      <button class="secondary" id="pauseButton" type="button">Pause</button>
    </div>
    <div class="result" id="result">No guess yet</div>
  </section>

  <section class="history hidden" id="history" aria-label="Recent guess errors"></section>

  <script>
    (() => {
      const minHz = 5;
      const maxHz = 40;
      const maxStoredGuesses = 500;
      const historyBarWidth = 16;
      const historyGap = 5;
      const historyRightInset = 16;
      const historyControlGap = 12;
      const slider = document.getElementById("guessSlider");
      const guessValue = document.getElementById("guessValue");
      const result = document.getElementById("result");
      const controls = document.getElementById("controls");
      const startPanel = document.getElementById("startPanel");
      const startButton = document.getElementById("startButton");
      const submitButton = document.getElementById("submitButton");
      const pauseButton = document.getElementById("pauseButton");
      const history = document.getElementById("history");
      const waveformTypes = [
        { id: "square", label: "Square" },
        { id: "sine", label: "Sine" },
        { id: "in-between", label: "In-between" }
      ];

      const state = {
        targetHz: 20,
        previousTargetHz: null,
        waveform: waveformTypes[0],
        colors: [
          { r: 34, g: 40, b: 49 },
          { r: 132, g: 197, b: 182 }
        ],
        startTime: 0,
        lastFrameTime: 0,
        animationId: 0,
        guessHistory: [],
        historySlots: 0,
        running: false,
        paused: true
      };

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomChoice(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function srgbToLinear(channel) {
        const value = channel / 255;
        return value <= 0.04045
          ? value / 12.92
          : Math.pow((value + 0.055) / 1.055, 2.4);
      }

      function relativeLuminance(color) {
        return (
          0.2126 * srgbToLinear(color.r) +
          0.7152 * srgbToLinear(color.g) +
          0.0722 * srgbToLinear(color.b)
        );
      }

      function contrastRatio(a, b) {
        const l1 = relativeLuminance(a);
        const l2 = relativeLuminance(b);
        const light = Math.max(l1, l2);
        const dark = Math.min(l1, l2);
        return (light + 0.05) / (dark + 0.05);
      }

      function hslToRgb(h, s, l) {
        const chroma = (1 - Math.abs(2 * l - 1)) * s;
        const hue = h / 60;
        const x = chroma * (1 - Math.abs((hue % 2) - 1));
        let r = 0;
        let g = 0;
        let b = 0;

        if (hue >= 0 && hue < 1) {
          r = chroma;
          g = x;
        } else if (hue < 2) {
          r = x;
          g = chroma;
        } else if (hue < 3) {
          g = chroma;
          b = x;
        } else if (hue < 4) {
          g = x;
          b = chroma;
        } else if (hue < 5) {
          r = x;
          b = chroma;
        } else {
          r = chroma;
          b = x;
        }

        const match = l - chroma / 2;
        return {
          r: Math.round((r + match) * 255),
          g: Math.round((g + match) * 255),
          b: Math.round((b + match) * 255)
        };
      }

      function randomMediumContrastPair() {
        for (let attempt = 0; attempt < 300; attempt += 1) {
          const hueA = randomBetween(0, 360);
          const hueB = (hueA + randomBetween(58, 162)) % 360;
          const colorA = hslToRgb(hueA, randomBetween(0.38, 0.68), randomBetween(0.32, 0.58));
          const colorB = hslToRgb(hueB, randomBetween(0.34, 0.62), randomBetween(0.42, 0.72));
          const ratio = contrastRatio(colorA, colorB);

          if (ratio >= 2.0 && ratio <= 4.2) {
            return Math.random() < 0.5 ? [colorA, colorB] : [colorB, colorA];
          }
        }

        return [
          { r: 39, g: 68, b: 91 },
          { r: 154, g: 189, b: 166 }
        ];
      }

      function randomTargetHz(previousHz) {
        while (true) {
          const candidate = Math.round(randomBetween(minHz, maxHz) * 10) / 10;
          const isLessCommonBand =
            (candidate >= 5 && candidate <= 10) ||
            (candidate >= 30 && candidate <= 40);

          if (previousHz !== null) {
            const difference = Math.abs(candidate - previousHz);

            if (difference < 5) {
              const normalizedDifference = difference / 5;
              const keepChance =
                normalizedDifference *
                normalizedDifference *
                (3 - 2 * normalizedDifference);

              if (Math.random() > keepChance) {
                continue;
              }
            }
          }

          if (isLessCommonBand && Math.random() < 1 / 3) {
            continue;
          }

          return candidate;
        }
      }

      function rgb(color) {
        return `rgb(${color.r}, ${color.g}, ${color.b})`;
      }

      function blend(a, b, bWeight) {
        const weight = clamp(bWeight, 0, 1);
        const aWeight = 1 - weight;

        return {
          r: Math.round(a.r * aWeight + b.r * weight),
          g: Math.round(a.g * aWeight + b.g * weight),
          b: Math.round(a.b * aWeight + b.b * weight)
        };
      }

      function errorColor(error) {
        if (error < 0.5) {
          return "#123dff";
        }

        if (error < 1) {
          return "#22f2ff";
        }

        if (error < 2.5) {
          return "#35e66a";
        }

        if (error < 5) {
          return "#ffd43b";
        }

        return "#ff4a4a";
      }

      function updateControlsHeight() {
        const height = controls.getBoundingClientRect().height;

        if (height > 0) {
          document.documentElement.style.setProperty("--controls-height", `${Math.round(height)}px`);
        }

        updateHistoryLayout();
      }

      function updateHistoryLayout() {
        if (controls.classList.contains("hidden")) {
          state.historySlots = 0;
          document.documentElement.style.setProperty("--history-width", "0px");
          renderHistory();
          return;
        }

        const controlsRect = controls.getBoundingClientRect();
        const availableWidth = Math.max(
          0,
          Math.floor(window.innerWidth - historyRightInset - controlsRect.right - historyControlGap)
        );
        const slots = Math.max(0, Math.floor((availableWidth + historyGap) / (historyBarWidth + historyGap)));
        const chartWidth = slots > 0
          ? slots * historyBarWidth + (slots - 1) * historyGap
          : 0;

        state.historySlots = slots;
        document.documentElement.style.setProperty("--history-width", `${chartWidth}px`);
        renderHistory();
      }

      function renderHistory() {
        history.replaceChildren();
        history.classList.toggle("hidden", state.guessHistory.length === 0 || state.historySlots === 0);

        if (state.historySlots === 0) {
          return;
        }

        for (const item of state.guessHistory.slice(-state.historySlots)) {
          const historyItem = document.createElement("div");
          const label = document.createElement("div");
          const bar = document.createElement("div");
          const normalizedHeight = clamp(item.error / 5, 0, 1) * 100;
          const sign = item.guess < item.target ? "-" : item.guess > item.target ? "+" : "";

          historyItem.className = "history-item";
          historyItem.style.setProperty("--label-bottom", `calc(max(3px, ${normalizedHeight}%) + 5px)`);
          label.className = "history-label";
          label.textContent = `${item.error.toFixed(1)}${sign}`;
          bar.className = "history-bar";
          bar.style.setProperty("--bar-height", `${normalizedHeight}%`);
          bar.style.setProperty("--bar-color", errorColor(item.error));
          historyItem.title = `Target ${item.target.toFixed(1)} Hz, guess ${item.guess.toFixed(1)} Hz, error ${item.error.toFixed(1)} Hz`;
          historyItem.append(label, bar);
          history.appendChild(historyItem);
        }
      }

      function recordGuess(guess, target, error) {
        state.guessHistory.push({ guess, target, error });

        if (state.guessHistory.length > maxStoredGuesses) {
          state.guessHistory.shift();
        }

        updateHistoryLayout();
      }

      function squareOnAt(seconds, hz) {
        const phase = ((seconds * hz) % 1 + 1) % 1;
        return phase < 0.5 ? 0 : 1;
      }

      function sineAt(seconds, hz) {
        return (1 - Math.cos(2 * Math.PI * hz * seconds)) / 2;
      }

      function onTimeWithinInterval(startSeconds, endSeconds, hz) {
        const duration = endSeconds - startSeconds;

        if (duration <= 0) {
          return squareOnAt(endSeconds, hz);
        }

        const samples = new Set([startSeconds, endSeconds]);
        const boundaryStep = 1 / (hz * 2);
        const firstBoundary = Math.ceil(startSeconds / boundaryStep) * boundaryStep;
        let boundaryStart = firstBoundary;

        if (boundaryStart <= startSeconds + Number.EPSILON) {
          boundaryStart += boundaryStep;
        }

        for (let boundary = boundaryStart; boundary < endSeconds; boundary += boundaryStep) {
          samples.add(boundary);
        }

        const ordered = Array.from(samples).sort((a, b) => a - b);
        let onDuration = 0;

        for (let index = 0; index < ordered.length - 1; index += 1) {
          const segmentStart = ordered[index];
          const segmentEnd = ordered[index + 1];
          const midpoint = (segmentStart + segmentEnd) / 2;

          if (squareOnAt(midpoint, hz) === 1) {
            onDuration += segmentEnd - segmentStart;
          }
        }

        return clamp(onDuration / duration, 0, 1);
      }

      function averageSineWithinInterval(startSeconds, endSeconds, hz) {
        const duration = endSeconds - startSeconds;

        if (duration <= 0) {
          return sineAt(endSeconds, hz);
        }

        const radiansPerSecond = 2 * Math.PI * hz;
        const integral =
          duration / 2 -
          (Math.sin(radiansPerSecond * endSeconds) - Math.sin(radiansPerSecond * startSeconds)) /
            (2 * radiansPerSecond);

        return clamp(integral / duration, 0, 1);
      }

      function waveformWeightAt(seconds, hz, waveform) {
        if (waveform.id === "sine") {
          return sineAt(seconds, hz);
        }

        if (waveform.id === "in-between") {
          return squareOnAt(seconds, hz) * 0.55 + sineAt(seconds, hz) * 0.45;
        }

        return squareOnAt(seconds, hz);
      }

      function averageWaveformWithinInterval(startSeconds, endSeconds, hz, waveform) {
        if (waveform.id === "sine") {
          return averageSineWithinInterval(startSeconds, endSeconds, hz);
        }

        if (waveform.id === "in-between") {
          return (
            onTimeWithinInterval(startSeconds, endSeconds, hz) * 0.55 +
            averageSineWithinInterval(startSeconds, endSeconds, hz) * 0.45
          );
        }

        return onTimeWithinInterval(startSeconds, endSeconds, hz);
      }

      function paintFrame(timestamp) {
        if (!state.running || state.paused) {
          return;
        }

        if (!state.startTime) {
          state.startTime = timestamp;
          state.lastFrameTime = timestamp;
        }

        const previous = (state.lastFrameTime - state.startTime) / 1000;
        const current = (timestamp - state.startTime) / 1000;
        const frameSeconds = current - previous;
        let onWeight;

        if (frameSeconds > 0.08) {
          onWeight = waveformWeightAt(current, state.targetHz, state.waveform);
        } else {
          onWeight = averageWaveformWithinInterval(previous, current, state.targetHz, state.waveform);
        }

        document.body.style.backgroundColor = rgb(blend(state.colors[0], state.colors[1], onWeight));
        state.lastFrameTime = timestamp;
        state.animationId = requestAnimationFrame(paintFrame);
      }

      function startAnimation() {
        cancelAnimationFrame(state.animationId);
        state.running = true;
        state.paused = false;
        state.startTime = 0;
        state.lastFrameTime = 0;
        pauseButton.textContent = "Pause";
        state.animationId = requestAnimationFrame(paintFrame);
      }

      function pauseAnimation() {
        state.paused = true;
        cancelAnimationFrame(state.animationId);
        document.body.style.backgroundColor = rgb(blend(state.colors[0], state.colors[1], 0.5));
        pauseButton.textContent = "Resume";
      }

      function resumeAnimation() {
        state.startTime = 0;
        state.lastFrameTime = 0;
        state.paused = false;
        pauseButton.textContent = "Pause";
        state.animationId = requestAnimationFrame(paintFrame);
      }

      function newTrial() {
        const nextTargetHz = randomTargetHz(state.previousTargetHz);
        state.previousTargetHz = nextTargetHz;
        state.targetHz = nextTargetHz;
        state.waveform = randomChoice(waveformTypes);
        state.colors = randomMediumContrastPair();
        startAnimation();
      }

      function updateGuessValue() {
        guessValue.textContent = `${Number(slider.value).toFixed(1)} Hz`;
      }

      function submitGuess() {
        const guess = Number(slider.value);
        const target = state.targetHz;
        const error = Math.abs(guess - target);
        const direction = guess > target ? "high" : guess < target ? "low" : "exact";
        const directionText = direction === "exact" ? "exact" : `${error.toFixed(1)} Hz ${direction}`;

        result.textContent = `Last: ${target.toFixed(1)} Hz | Guess: ${guess.toFixed(1)} Hz | Error: ${directionText}`;
        recordGuess(guess, target, error);
        newTrial();
      }

      startButton.addEventListener("click", () => {
        startPanel.classList.add("hidden");
        controls.classList.remove("hidden");
        updateControlsHeight();
        updateGuessValue();
        newTrial();
      });

      slider.addEventListener("input", updateGuessValue);
      submitButton.addEventListener("click", submitGuess);

      pauseButton.addEventListener("click", () => {
        if (!state.running) {
          return;
        }

        if (state.paused) {
          resumeAnimation();
        } else {
          pauseAnimation();
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.running && !state.paused) {
          pauseAnimation();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state.running && !state.paused) {
          pauseAnimation();
        }
      });

      if ("ResizeObserver" in window) {
        new ResizeObserver(updateControlsHeight).observe(controls);
      }

      window.addEventListener("resize", updateControlsHeight);
      updateGuessValue();
      renderHistory();
      document.body.style.backgroundColor = "#222831";
    })();
  </script>
</body>
</html>
