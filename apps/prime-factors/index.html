<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Factors 3D</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="three-canvas" aria-hidden="true"></canvas>

    <aside class="sidebar">
        <h1>Prime Factors 3D</h1>
        <form id="controls" class="controls">
            <div class="control-field">
                <label for="startNumberInput">Start Number</label>
                <input id="startNumberInput" name="startNumber" type="text" inputmode="numeric" value="1" autocomplete="off">
            </div>
            <div class="control-field">
                <label for="numbersPerLoopInput">Coil Number</label>
                <input id="numbersPerLoopInput" name="numbersPerLoop" type="number" value="30" min="6" max="96" step="1">
            </div>
            <div class="control-field">
                <label for="colorModeSelect">Colors</label>
                <select id="colorModeSelect" name="colorMode">
                    <option value="simple">Simple Colors</option>
                    <option value="extended" selected>Extended Colors</option>
                </select>
            </div>
            <label class="checkbox-field">
                <input id="showTunnelLabelsInput" name="showTunnelLabels" type="checkbox" checked>
                <span>Coil Labels</span>
            </label>
            <button type="submit">Generate</button>
        </form>
    </aside>

    <div id="tooltip" role="status" aria-hidden="true"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
